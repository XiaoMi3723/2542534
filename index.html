<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABCD四班 2026 排班校准</title>
    <style>
        :root { --day-color: #FF9800; --night-color: #F44336; --rest-color: #f8fcf9; --rest-text: #4CAF50; --today-blue: #2196F3; --nav-bg: #263238; }
        body { font-family: -apple-system, sans-serif; background: #cfd8dc; display: flex; flex-direction: column; align-items: center; padding: 10px; margin: 0; }
        
        .nav { width: 100%; max-width: 420px; background: var(--nav-bg); padding: 15px; border-radius: 12px 12px 0 0; box-sizing: border-box; color: white; }
        .nav-row { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
        .nav-row:last-child { margin-bottom: 0; }
        
        .nav button { height: 38px; box-sizing: border-box; border-radius: 6px; font-size: 14px; border: none; flex: 1; text-align: center; background: #455a64; color: white; cursor: pointer; transition: background 0.2s; }
        .nav button:active { background: #546e7a; transform: scale(0.96); } 
        
        .search-box { display: flex; align-items: center; background: white; border-radius: 6px; flex: 1; height: 38px; padding: 0 12px; box-sizing: border-box; overflow: hidden; }
        .search-box span { font-size: 13px; color: #546e7a; font-weight: bold; white-space: nowrap; margin-right: 8px; }
        .search-box input[type="date"] { flex: 1; border: none; outline: none; background: transparent; font-size: 14px; color: #333; height: 100%; padding: 0; cursor: pointer; }
        
        /* ===== 班次切换 ===== */
        .shift-row { display: flex; gap: 8px; margin-bottom: 12px; }
        .shift-btn { flex: 1; height: 42px; border-radius: 8px; font-size: 15px; font-weight: bold; border: 2px solid var(--sc); background: transparent; color: var(--sc); cursor: pointer; transition: background 0.2s, color 0.2s, transform 0.1s; }
        .shift-btn:active { transform: scale(0.96); }
        .shift-btn.active { background: var(--sc); color: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,0.15) inset; }
        
        .card { background: white; width: 100%; max-width: 420px; padding: 10px; border: 1px solid #b0bec5; border-bottom: none; box-sizing: border-box; }
        .month-label { font-weight: bold; text-align: center; font-size: 20px; color: #37474f; margin: 10px 0 15px 0; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th { font-size: 11px; padding: 8px 0; color: #546e7a; border-bottom: 2px solid var(--nav-bg); }
        .ww-col { background: var(--nav-bg); color: #eceff1; font-size: 11px; text-align: center; width: 45px; height: 48px; border: 1px solid #37474f; }
        .dr-col { font-size: 9px; color: #90a4ae; display: block; margin-top: 2px; }
        .cell { border: 1px solid #e0e0e0; text-align: center; font-weight: bold; font-size: 15px; height: 48px; position: relative; }
        .tiny-date { position: absolute; top: 2px; left: 3px; font-size: 9px; font-weight: normal; color: #999; }
        .tiny-date.hd { color: #e53935; font-weight: bold; }
        .is-night .tiny-date.hd { color: #fff; }
        .holiday-badge {
            position: absolute; right: 2px; bottom: 2px;
            display: inline-flex; align-items: center; gap: 2px;
            background: #fff; border: 1px solid #e53935; border-radius: 7px;
            padding: 1px 3px; box-sizing: border-box;
            box-shadow: 0 1px 2px rgba(0,0,0,0.12);
        }
        .holiday-badge .h-name { font-size: 8px; color: #e53935; font-weight: bold; line-height: 1; }
        .holiday-badge .h-dot { width: 5px; height: 5px; border-radius: 50%; background: #e53935; flex: none; }
        .is-day { background: var(--day-color); color: white; }
        .is-night { background: var(--night-color); color: white; }
        .is-rest { background: var(--rest-color); color: var(--rest-text); }
        
        @keyframes shadow-pulse {
            0% { box-shadow: inset 0 0 0 4px var(--today-blue), 0 0 0 0px rgba(33, 150, 243, 0.7); }
            50% { box-shadow: inset 0 0 0 4px var(--today-blue), 0 0 0 12px rgba(33, 150, 243, 0); }
            100% { box-shadow: inset 0 0 0 4px var(--today-blue), 0 0 0 0px rgba(33, 150, 243, 0); }
        }
        .today { z-index: 99; background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%) !important; animation: shadow-pulse 1.5s infinite; color: #0d47a1 !important; border: none !important; }
        
        .status-footer { width: 100%; max-width: 420px; background: #fff; border: 1px solid #b0bec5; border-radius: 0 0 12px 12px; padding: 20px 15px; box-sizing: border-box; text-align: center; border-top: 2px dashed #cfd8dc; min-height: 100px; cursor: pointer; user-select: none; }
        .legend { margin-bottom: 8px; }
        .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: #607d8b; margin: 0 7px; }
        .chip::before { content: ''; width: 10px; height: 10px; border-radius: 3px; }
        .chip.day::before { background: var(--day-color); }
        .chip.night::before { background: var(--night-color); }
        .chip.rest::before { background: #c8e6c9; outline: 1px solid var(--rest-text); }
        .chip.holiday::before { background: #e53935; border-radius: 50%; }
        .today-status { font-size: 24px; font-weight: bold; margin-bottom: 10px; }
        .funny-quote { font-size: 14px; color: #78909c; font-style: italic; line-height: 1.4; }
    </style>
</head>
<body>
<div class="nav">
    <div class="nav-row">
        <button onclick="move(-1)">上个月</button>
        <button style="background:var(--today-blue);font-weight:bold" onclick="toToday()">回到今天</button>
        <button onclick="move(1)">下个月</button>
    </div>
    <div class="shift-row">
        <button class="shift-btn" data-shift="A" style="--sc:#2196F3" onclick="selectShift('A')">A班</button>
        <button class="shift-btn" data-shift="B" style="--sc:#F44336" onclick="selectShift('B')">B班</button>
        <button class="shift-btn" data-shift="C" style="--sc:#4CAF50" onclick="selectShift('C')">C班</button>
        <button class="shift-btn active" data-shift="D" style="--sc:#FF9800" onclick="selectShift('D')">D班</button>
    </div>
    <div class="nav-row">
        <div class="search-box">
            <span>跳转日期:</span>
            <input type="date" id="datePicker" onchange="search(this.value)">
        </div>
    </div>
</div>
<div class="card">
    <div id="mLabel" class="month-label">加载中...</div>
    <table>
        <thead><tr><th style="width:45px">WW</th><th>Sun</th><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th></tr></thead>
        <tbody id="grid"></tbody>
    </table>
</div>
<div class="status-footer" onclick="refreshQuote()">
    <div class="legend">
        <span class="chip day">白班</span>
        <span class="chip night">夜班</span>
        <span class="chip rest">休息</span>
        <span class="chip holiday">法定节假日·3倍</span>
    </div>
    <div id="statusLabel" class="today-status">状态读取中...</div>
    <div id="quoteLabel" class="funny-quote">点击我有惊喜...</div>
</div>
<script>
/* ===== D 班全年数据（源数据）===== */
/* 排班编码：0=休  1=白班  2=夜班 */
/* 月份分组与官方排班卡一致（如 8 月 = 第31/32/33/34 周） */
const fullData = [
    { m: "January", weeks: [{ w: "01", r: "12-28", s: [0,0,0,2,2,2,2] }, { w: "02", r: "1-4", s: [0,0,0,0,2,2,2] }, { w: "03", r: "1-11", s: [0,0,0,2,2,2,2] }, { w: "04", r: "1-18", s: [0,0,0,0,2,2,2] }]},
    { m: "February", weeks: [{ w: "05", r: "1-25", s: [0,0,0,2,2,2,2] }, { w: "06", r: "2-1", s: [0,0,0,0,2,2,2] }, { w: "07", r: "2-8", s: [0,0,0,2,2,2,2] }, { w: "08", r: "2-15", s: [0,0,0,0,2,2,2] }]},
    { m: "March", weeks: [{ w: "09", r: "2-22", s: [0,0,0,0,2,2,2] }, { w: "10", r: "3-1", s: [0,0,0,2,2,2,2] }, { w: "11", r: "3-8", s: [0,0,0,0,2,2,2] }, { w: "12", r: "3-15", s: [0,0,0,2,2,2,2] }, { w: "13", r: "3-22", s: [0,0,0,0,2,2,2] }]},
    { m: "April", weeks: [{ w: "14", r: "3-29", s: [0,0,0,1,1,1,1] }, { w: "15", r: "4-5", s: [0,0,0,0,1,1,1] }, { w: "16", r: "4-12", s: [0,0,0,1,1,1,1] }, { w: "17", r: "4-19", s: [0,0,0,0,1,1,1] }]},
    { m: "May", weeks: [{ w: "18", r: "4-26", s: [0,0,0,2,2,2,2] }, { w: "19", r: "5-3", s: [0,0,0,0,2,2,2] }, { w: "20", r: "5-10", s: [0,0,0,2,2,2,2] }, { w: "21", r: "5-17", s: [0,0,0,0,2,2,2] }]},
    { m: "June", weeks: [{ w: "22", r: "5-24", s: [0,0,0,1,1,1,1] }, { w: "23", r: "5-31", s: [0,0,1,1,1,0,0] }, { w: "24", r: "6-7", s: [1,1,1,1,0,0,0] }, { w: "25", r: "6-14", s: [1,1,1,0,0,0,0] }, { w: "26", r: "6-21", s: [1,1,1,1,0,0,0] }]},
    { m: "July", weeks: [{ w: "27", r: "6-28", s: [2,2,2,0,0,0,0] }, { w: "28", r: "7-5", s: [2,2,2,2,0,0,0] }, { w: "29", r: "7-12", s: [2,2,2,0,0,0,0] }, { w: "30", r: "7-19", s: [2,2,2,2,0,0,0] }]},
    { m: "August", weeks: [{ w: "31", r: "7-26", s: [1,1,1,0,0,0,0] }, { w: "32", r: "8-2", s: [1,1,1,1,0,0,0] }, { w: "33", r: "8-9", s: [1,1,1,0,0,0,0] }, { w: "34", r: "8-16", s: [1,1,1,1,0,0,0] }]},
    { m: "September", weeks: [{ w: "35", r: "8-23", s: [2,2,2,0,0,0,0] }, { w: "36", r: "8-30", s: [2,2,2,2,0,0,0] }, { w: "37", r: "9-6", s: [2,2,2,0,0,0,0] }, { w: "38", r: "9-13", s: [2,2,2,2,0,0,0] }, { w: "39", r: "9-20", s: [2,2,2,0,0,0,0] }]},
    { m: "October", weeks: [{ w: "40", r: "9-27", s: [1,1,1,1,0,0,0] }, { w: "41", r: "10-4", s: [1,1,1,0,0,0,0] }, { w: "42", r: "10-11", s: [1,1,1,1,0,0,0] }, { w: "43", r: "10-18", s: [1,1,1,0,0,0,0] }]},
    { m: "November", weeks: [{ w: "44", r: "10-25", s: [2,2,2,2,0,0,0] }, { w: "45", r: "11-1", s: [2,2,2,0,0,0,0] }, { w: "46", r: "11-8", s: [2,2,2,2,0,0,0] }, { w: "47", r: "11-15", s: [2,2,2,0,0,0,0] }]},
    { m: "December", weeks: [{ w: "48", r: "11-22", s: [1,1,1,1,0,0,0] }, { w: "49", r: "11-29", s: [1,1,1,0,0,0,0] }, { w: "50", r: "12-6", s: [1,1,1,1,0,0,0] }, { w: "51", r: "12-13", s: [1,1,1,0,0,0,0] }, { w: "52", r: "12-20", s: [1,1,1,1,0,0,0] }]}
];

/* ===== 班次生成规则（依据官方排班卡校验）=====
 * D：源数据
 * C：和 D 同一天上班，白夜互换（D夜→C白）
 * B：D 休息的那几天上班，班型跟随 D（D 这周上白 B 就上白，上夜 B 就上夜）
 * A：和 B 同一天上班，白夜互换（B夜→A白）
 */
const SHIFT_META = {
    A: { label: 'A班', color: '#2196F3' },
    B: { label: 'B班', color: '#F44336' },
    C: { label: 'C班', color: '#4CAF50' },
    D: { label: 'D班', color: '#FF9800' }
};

function deriveWeek(shift, d) {
    if (shift === 'D') return d.slice();
    if (shift === 'C') return d.map(x => x === 0 ? 0 : (x === 1 ? 2 : 1));
    const wt = d.find(x => x !== 0) || 1;              // D 本周班型（白或夜）
    const b = d.map(x => x !== 0 ? 0 : wt);            // B：D休我上，类型跟随D
    if (shift === 'B') return b;
    return b.map(x => x === 0 ? 0 : (x === 1 ? 2 : 1)); // A：与B白夜互换
}

function buildShiftData(shift) {
    return fullData.map(m => ({
        m: m.m,
        weeks: m.weeks.map(w => ({ w: w.w, r: w.r, s: deriveWeek(shift, w.s) }))
    }));
}

const allData = {
    A: buildShiftData('A'),
    B: buildShiftData('B'),
    C: buildShiftData('C'),
    D: buildShiftData('D')
};

/* ===== 交互状态 ===== */
const quotes = [
    "何时葡萄先熟透，你要静侯再静候。",
    "不想上班 上班想杀人。",
    "想回家看 凡人修仙传。",
    "事情终于有了新的退展。",
    "有什么事明天也别说。",
    "这个班 你不来 牛来。"
];
let curShift = 'D';
const today = new Date();

/* r 表示该周周日日期；12-28 属 2025 年 12 月，单独校正回上一年 */
function getActualDateObj(startRange, offset) {
    let parts = startRange.split('-');
    let date = new Date(2026, parseInt(parts[0]) - 1, parseInt(parts[1]));
    if (date.getDay() !== 0) date.setFullYear(2025);
    date.setDate(date.getDate() + offset);
    return date;
}

/* ===== 2026年法定节假日（《全国年节及纪念日放假办法》2025修订版）：当天上班支付300%工资 =====
 * 元旦1天 / 春节除夕至初三4天 / 清明1天 / 劳动节2天 / 端午1天 / 中秋1天 / 国庆3天
 */
const HOLIDAYS = [
    { m: 1,  d: 1,  name: '元旦' },
    { m: 2,  d: 16, name: '除夕' },
    { m: 2,  d: 17, name: '春节' },
    { m: 2,  d: 18, name: '初二' },
    { m: 2,  d: 19, name: '初三' },
    { m: 4,  d: 5,  name: '清明' },
    { m: 5,  d: 1,  name: '劳动节' },
    { m: 5,  d: 2,  name: '劳动节' },
    { m: 6,  d: 19, name: '端午' },
    { m: 9,  d: 25, name: '中秋' },
    { m: 10, d: 1,  name: '国庆' },
    { m: 10, d: 2,  name: '国庆' },
    { m: 10, d: 3,  name: '国庆' }
];
function getHoliday(d) {
    return HOLIDAYS.find(h => d.getFullYear() === 2026 && d.getMonth() === h.m - 1 && d.getDate() === h.d) || null;
}

/* 找到"包含今天的那个月份视图"（按官方分组逐月查找），供回到今天/首次加载使用 */
function findMonthOfToday() {
    const t = today.toDateString();
    for (let m = 0; m < fullData.length; m++) {
        for (let k = 0; k < fullData[m].weeks.length; k++) {
            const w = fullData[m].weeks[k];
            for (let i = 0; i < 7; i++) {
                if (t === getActualDateObj(w.r, i).toDateString()) return m;
            }
        }
    }
    return today.getMonth();
}

let curM = findMonthOfToday();

function refreshQuote() {
    const randomIdx = Math.floor(Math.random() * quotes.length);
    document.getElementById('quoteLabel').innerText = quotes[randomIdx];
}

function draw() {
    const meta = SHIFT_META[curShift];
    const mData = allData[curShift][curM];
    document.getElementById('mLabel').innerText = meta.label + ' · ' + mData.m + ' 2026';
    const grid = document.getElementById('grid');
    grid.innerHTML = "";
    let todayStatusTxt = "";
    let todayColor = "#78909c";
    mData.weeks.forEach(w => {
        let row = `<tr><td class="ww-col">${w.w}<span class="dr-col">${w.r}</span></td>`;
        w.s.forEach((v, i) => {
            let dObj = getActualDateObj(w.r, i);
            let isT = (today.toDateString() === dObj.toDateString());
            let hd = getHoliday(dObj);
            let cls = v==1?'is-day':v==2?'is-night':'is-rest';
            let txt = v==1?'白':v==2?'夜':'休';
            if(isT) { todayStatusTxt = v==1?'白班':v==2?'夜班':'休息'; todayColor = v==1?'#FF9800':v==2?'#F44336':'#4CAF50'; }
            row += `<td class="cell ${cls} ${isT?'today':''}">
                      <span class="tiny-date${hd?' hd':''}">${dObj.getMonth()+1}/${dObj.getDate()}</span>${txt}
                      ${hd ? `<span class="holiday-badge"><span class="h-name">${hd.name}</span><span class="h-dot"></span></span>` : ''}
                    </td>`;
        });
        grid.innerHTML += row + "</tr>";
    });
    if (todayStatusTxt === "") {
        document.getElementById('statusLabel').innerText = "今天不在当前月份";
        document.getElementById('statusLabel').style.color = "#78909c";
    } else {
        document.getElementById('statusLabel').innerText = "今天（" + meta.label + "）：" + todayStatusTxt;
        document.getElementById('statusLabel').style.color = todayColor;
    }
}

function selectShift(s) {
    curShift = s;
    document.querySelectorAll('.shift-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.shift === s);
    });
    draw();
}

function move(n) { curM = Math.max(0, Math.min(11, curM + n)); draw(); }
function toToday() { curM = findMonthOfToday(); draw(); }
function search(v) {
    if(!v) return;
    let d = new Date(v);
    if(d.getFullYear() == 2026){ curM = d.getMonth(); draw(); }
}

draw();
document.getElementById('quoteLabel').innerText = quotes[Math.floor(Math.random() * quotes.length)];
</script>
</body>
</html>
